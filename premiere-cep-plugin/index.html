<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hafez Studio Finisher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <div class="mark">H</div>
      <div><b>Hafez Studio</b><small>Premiere Finisher · Editable MOGRT</small></div>
    </header>
    <section class="glass">
      <span class="eyebrow">MOTION PACK V2</span>
      <h1>موشن‌های قابل‌ویرایش را روی سکانس فعال بچین</h1>
      <p>Plan نهایی را انتخاب کن؛ MOGRTهای واقعی، متن قابل‌ویرایش، Glow و Flowchartها روی Trackهای رزروشده درج می‌شوند.</p>
      <label class="check"><input id="muteGuide" type="checkbox" /> فقط برای XMLهای قدیمی، V3 راهنما Mute شود</label>
      <button id="apply">انتخاب Plan و اجرای Finisher</button>
    </section>
    <section class="status">
      <div><span>ورودی</span><strong id="planName">انتخاب نشده</strong></div>
      <div><span>وضعیت</span><strong id="state">آماده</strong></div>
    </section>
    <pre id="log">Hafez Finisher آماده است.</pre>
  </main>
  <script src="panel.js"></script>
</body>
</html>
