<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hafez Finisher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <div class="eyebrow">HAFEZ · PREMIERE</div>
        <h1>Studio Finisher</h1>
        <p>متن‌های هوشمند را با MOGRTهای خودت روی Director Cut می‌چیند.</p>
      </header>

      <section class="card">
        <div class="row">
          <span>فونت خروجی</span>
          <strong>Adaptive Persian</strong>
        </div>
        <label class="check">
          <input id="muteFallback" type="checkbox" />
          <span>فقط برای XML قدیمی، لایه PNG راهنما را Mute کن</span>
        </label>
      </section>

      <button id="applyPlan" class="primary">انتخاب Premiere Plan و اجرای MOGRT</button>
      <button id="clearLog" class="secondary">پاک‌کردن گزارش</button>

      <section class="log-wrap">
        <div class="log-title">گزارش اجرا</div>
        <pre id="log">آماده‌ام. سکانس «03 - Hafez Director Cut» را فعال کن.</pre>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
